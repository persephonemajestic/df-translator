name: Sync kkrb

# Раз в неделю (и при изменении скрипта) забирает свежие квесты с kkrb.net в data/kkrb_quests.json.
on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths: ["tools/sync_kkrb.py", ".github/workflows/sync.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Забрать квесты
        run: |
          set +e
          python tools/sync_kkrb.py 2> err.txt
          code=$?
          cat err.txt
          if [ $code -ne 0 ]; then echo "::error::$(tail -c 1200 err.txt | tr '\n' ' ')"; exit 1; fi
      - name: Закоммитить, если изменилось
        run: |
          git config user.name "kkrb-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/kkrb_quests.json
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "Данные квестов kkrb [skip release]"
          git push
