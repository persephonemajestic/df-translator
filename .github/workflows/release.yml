name: Release

# Релиз выпускается при пуше тега вида v1.0.1: собирается один DFTranslator.exe и прикладывается к релизу.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" dftranslator/__init__.py
          cat dftranslator/__init__.py | grep __version__

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Тесты
        run: python -m pytest tests -q

      - name: Иконка
        run: python tools/make_icon.py

      - name: Сборка .exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile --name DFTranslator
          --icon assets/icon.ico --add-data "data;data"
          --collect-all rapidocr_onnxruntime
          --exclude-module tkinter --exclude-module matplotlib
          run_app.py

      - name: Проверка запуска
        shell: pwsh
        run: |
          $size = (Get-Item dist/DFTranslator.exe).Length
          Write-Host "Размер: $([math]::Round($size/1MB,1)) МБ"
          if ($size -lt 20MB) { throw "exe подозрительно мал" }

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DFTranslator.exe \
            --title "DF Translator $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md

      - name: Артефакт (ручной запуск)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: DFTranslator
          path: dist/DFTranslator.exe
