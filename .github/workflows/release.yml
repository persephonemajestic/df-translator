name: Release

# Каждый пуш в main (кроме правок README/баннера) сам выпускает новую версию:
# номер = последний релиз + 1 в последней цифре. Тег v* тоже работает — тогда номер берётся из тега.
# Чтобы запушить без релиза, добавьте в сообщение коммита [skip release].
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "assets/banner.svg", ".gitignore", "data/**", "RELEASE_NOTES.md"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Номер версии
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LAST=$(gh release list --limit 50 --json tagName -q '.[].tagName' | sed 's/^v//' | sort -V | tail -1)
            LAST=${LAST:-1.0.0}
            IFS=. read -r MA MI PA <<< "$LAST"
            VERSION="$MA.$MI.$(( ${PA:-0} + 1 ))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" dftranslator/__init__.py
          grep __version__ dftranslator/__init__.py

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Тесты (логика, окна Qt, OCR, запуск программы)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q -rs

      - name: Иконка
        run: python tools/make_icon.py

      - name: Сборка .exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile --name DFTranslator
          --icon assets/icon.ico --add-data "data;data" --add-data "assets/icon.png;assets"
          --collect-all rapidocr_onnxruntime
          --exclude-module tkinter --exclude-module matplotlib
          run_app.py

      - name: Проверка запуска
        shell: pwsh
        run: |
          $size = (Get-Item dist/DFTranslator.exe).Length
          Write-Host "Размер: $([math]::Round($size/1MB,1)) МБ"
          if ($size -lt 20MB) { throw "exe подозрительно мал" }

      - name: Опубликовать релиз
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          # Релиз могли уже создать вручную на сайте — тогда просто прикладываем exe.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/DFTranslator.exe --clobber
          else
            gh release create "$TAG" dist/DFTranslator.exe --target "$GITHUB_SHA" \
              --title "DF Translator $TAG" --notes-file RELEASE_NOTES.md
          fi

      - name: Артефакт (ручной запуск)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: DFTranslator
          path: dist/DFTranslator.exe
