name: UI preview

# Пуш в ветку ui-preview: тесты окон и снимки на разных размерах окна -> ветка ui-shots. Релиз не выпускается.
on:
  push:
    branches: [ui-preview, "ui-preview-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Шрифты (Noto Sans с хинтингом — SIL OFL)
        shell: bash
        run: |
          mkdir -p assets/fonts
          base=https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSans/hinted/ttf
          for w in Regular Medium SemiBold Bold; do
            curl -sSfL -o "assets/fonts/NotoSans-$w.ttf" "$base/NotoSans-$w.ttf"
          done
          curl -sSfL -o assets/fonts/OFL.txt https://raw.githubusercontent.com/notofonts/latin-greek-cyrillic/main/OFL.txt || true
          ls -la assets/fonts
      - name: Зависимости
        run: pip install -r requirements.txt pytest
      - name: Тесты окон
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        shell: bash
        run: |
          python -X faulthandler -m pytest tests -v -rs --junitxml=junit.xml > test.log 2>&1 || echo "pytest exit $?" >> test.log
          for i in $(seq 1 5); do python -X faulthandler -m pytest tests/test_qt_smoke.py -q -k "quest_browser or quest_card or small_sizes" > rep.log 2>&1 || { echo "== прогон $i упал"; cat rep.log; } >> test.log; done
          echo "повторы закончены" >> test.log
          python -c "import xml.etree.ElementTree as E;r=E.parse('junit.xml').getroot();s=r if r.tag=='testsuite' else r[0];print('tests',s.get('tests'),'failures',s.get('failures'),'errors',s.get('errors'))" | tee -a test.log
      - name: Снимки
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        shell: bash
        run: python tools/ui_shots.py shots 2>&1 | tee -a test.log || true
      - name: Опубликовать снимки
        if: always()
        shell: bash
        run: |
          cp test.log shots/ 2>/dev/null || true
          cd shots
          git init -q -b ui-shots
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "shots ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-shots
