<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="DF Translator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#14211d"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd69b"/>
      <stop offset="1" stop-color="#17a070"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="20" fill="url(#grid)"/>
  <circle cx="1130" cy="40" r="190" fill="#22c58b" fill-opacity="0.07"/>
  <circle cx="1230" cy="260" r="120" fill="#22c58b" fill-opacity="0.05"/>

  <rect x="90" y="75" width="150" height="150" rx="38" fill="url(#ac)"/>
  <text x="165" y="178" text-anchor="middle" font-size="96" font-weight="700" fill="#06231a"
        font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',sans-serif">译</text>

  <text x="285" y="148" font-size="68" font-weight="800" fill="#e8ebf0"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">DF Translator</text>
  <text x="288" y="192" font-size="26" fill="#9aa5b4"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Переводчик экрана для китайской Delta Force</text>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600">
    <rect x="288" y="214" width="190" height="34" rx="17" fill="#22c58b" fill-opacity="0.14"/>
    <text x="383" y="237" text-anchor="middle" fill="#2fd69b">Без внедрения в игру</text>
    <rect x="490" y="214" width="170" height="34" rx="17" fill="#22c58b" fill-opacity="0.14"/>
    <text x="575" y="237" text-anchor="middle" fill="#2fd69b">Лор-глоссарий</text>
    <rect x="672" y="214" width="190" height="34" rx="17" fill="#22c58b" fill-opacity="0.14"/>
    <text x="767" y="237" text-anchor="middle" fill="#2fd69b">Автообновление</text>
  </g>
</svg>
